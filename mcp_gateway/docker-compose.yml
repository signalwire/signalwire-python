services:
  mcp-gateway:
    build: .
    container_name: mcp-gateway
    ports:
      - "${MCP_PORT:-8080}:${MCP_PORT:-8080}"
    volumes:
      # This directory, so the gateway can use your config.json if you have one
      - .:/app/host:ro
      # Mount certs and logs directories
      - ./certs:/app/certs
      - ./logs:/app/logs
      # Create a named volume for the sandbox
      - mcp-sandbox:/app/sandbox
    environment:
      - PYTHONUNBUFFERED=1
      # Each variable has a default here: passing an unset variable through
      # would give the gateway an empty value instead of its default.
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_PORT=${MCP_PORT:-8080}
      - MCP_AUTH_USER=${MCP_AUTH_USER:-admin}
      # Required. With the published default password, the gateway listens on
      # 127.0.0.1 only, which can't be reached from outside the container.
      - MCP_AUTH_PASSWORD=${MCP_AUTH_PASSWORD:?Set MCP_AUTH_PASSWORD in .env or the environment}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MCP_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Use config.json from this directory if it exists; otherwise
    # mcp-gateway starts from the image's sample_config.json.
    entrypoint: >
      sh -c "
        if [ -f /app/host/config.json ]; then
          cp /app/host/config.json /app/config.json
          echo 'Using config.json from host mount'
        else
          echo 'No config.json found, using sample_config.json'
        fi
        exec mcp-gateway -c config.json
      "

volumes:
  mcp-sandbox:
