name: Doc Audit

# Fails if a method referenced in docs/ or examples/ does not resolve in the
# public SDK surface (see porting-sdk/python_surface.json) and is not listed
# in DOC_AUDIT_IGNORE.md with a rationale. Also runs `python -m py_compile`
# over every example script to catch syntax errors introduced by a drift fix.

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Nightly at 07:13 UTC — catches drift introduced by changes in porting-sdk
    # or in the Python SDK between PR cycles.
    - cron: '13 7 * * *'
  workflow_dispatch:

jobs:
  doc-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out signalwire-python
        uses: actions/checkout@v7
        with:
          path: signalwire-python

      - name: Check out porting-sdk (provides audit scripts + surface JSON)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          # Coordinated-pass pin: `main` normally; set the PORTING_SDK_REF repo variable
          # to a wave branch to test a coordinated porting-sdk change, declared on the PR
          # (see porting-sdk/COORDINATED_PASS.md). No revert commit.
          ref: ${{ vars.PORTING_SDK_REF || 'main' }}
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Compile every example (catches syntax-level phantom APIs)
        # py_compile only verifies syntax, but any example that calls a phantom
        # import or syntax error will fail here before the audit even runs.
        run: |
          cd signalwire-python
          python -m py_compile examples/*.py rest/examples/*.py relay/examples/*.py

      # Regenerate the native-only sidecar BEFORE the audit reads it, so a renamed or
      # deleted livewire member stops resolving instead of staying excused by a stale
      # committed file. Mirrors run-ci.sh's SURFACE-NATIVE gate (DOC-AUDIT deps on it).
      - name: Regenerate the native-only doc-audit sidecar
        # `python` (the setup-python shim), not bare `python3` — see the PACKAGE-SMOKE
        # note in multi-os.yml. This job is ubuntu-only, where setup-python front-loads
        # its dir so both names currently resolve to the toolcache; using the shim keeps
        # that true if this workflow ever gains a macOS runner, where bare `python3`
        # resolves to the framework Python instead.
        run: |
          python signalwire-python/scripts/emit_surface_native.py \
            --out signalwire-python/port_surface_native.json

      - name: Run audit_docs.py against the Python surface
        # --native-names is load-bearing: signalwire.livewire.* is excluded from the
        # surface oracle by design, but livewire/ docs are in this perimeter, so its
        # real members only resolve via the sidecar. See scripts/emit_surface_native.py.
        run: |
          python porting-sdk/scripts/audit_docs.py \
            --root signalwire-python \
            --surface porting-sdk/python_surface.json \
            --ignore signalwire-python/DOC_AUDIT_IGNORE.md \
            --native-names signalwire-python/port_surface_native.json

      # The DRIFT half of the regenerate/check pair, mirroring run-ci.sh's
      # SURFACE-NATIVE-FRESH. Runs AFTER the audit has consumed the fresh file. On CI
      # this cannot leak into a commit (the checkout is ephemeral), but it is what
      # makes a STALE committed sidecar fail loudly here instead of passing unnoticed
      # and then drifting further.
      - name: Committed sidecar matches the regenerated one (no drift)
        run: |
          cd signalwire-python
          git diff --exit-code -- port_surface_native.json

      - name: Summary
        if: always()
        run: |
          echo "### Doc Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Verifies every \`.method(\` reference in \`docs/\`, \`examples/\`, \`rest/**\`, \`relay/**\` resolves in \`python_surface.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- Ignores listed in \`DOC_AUDIT_IGNORE.md\` (each entry has a rationale)" >> $GITHUB_STEP_SUMMARY
          echo "- Also runs \`python -m py_compile\` on every example script" >> $GITHUB_STEP_SUMMARY
