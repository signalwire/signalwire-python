site_name: SignalWire Python SDK
site_description: API reference for the SignalWire Python SDK, generated from docstrings.
site_url: https://signalwire.github.io/signalwire-python/

# Generated per-run by gen.sh (one API page per public module of `signalwire`,
# an index page per package, plus a generated landing page). This is NOT the repo's
# existing top-level docs/ dir (owned by doc-audit.yml) — keep them separate.
docs_dir: _docs
site_dir: _site
use_directory_urls: false

# Served under the project-pages subpath (/signalwire-python/); links stay relative.
theme:
  name: material
  custom_dir: overrides
  favicon: assets/img/signalwire-favicon.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    # Light / dark toggle. The injected Fern theme button drives these.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/fern/tokens.css
  - assets/fern/fern.css
  - assets/css/navbar.css

extra_javascript:
  - assets/js/navbar.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../signalwire]   # the nested package: signalwire/signalwire
          options:
            show_source: false
            show_submodules: true
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_if_no_docstring: true
  # Publishes llms.txt at the site root, plus a Markdown copy of every page next
  # to its HTML (api/core/agent_base.html -> api/core/agent_base.md). The globs
  # cover every page gen.sh writes; gen.sh fails the build if llms.txt misses one.
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Overview:
          - index.md
        API reference:
          - api/*.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
